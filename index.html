<style>
@font-face{font-family:"Sora";font-weight:600;font-display:swap;src:url(fonts/sora-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Sora";font-weight:700;font-display:swap;src:url(fonts/sora-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:400;font-display:swap;src:url(fonts/manrope-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:500;font-display:swap;src:url(fonts/manrope-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:600;font-display:swap;src:url(fonts/manrope-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:700;font-display:swap;src:url(fonts/manrope-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:600;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:#0c0716}
body{margin:0}
:root{color-scheme:dark;
  --bg:#0c0716; --card:rgba(22,13,40,.62); --card-solid:#160d28; --fg:#ffffff; --muted:#a99fc4; --line:rgba(255,255,255,.09); --field:rgba(0,0,0,.32);
  --purple:#a855f7; --purple-d:#9333ea; --fuchsia:#e879f9; --pink:#ff2e7a; --cyan:#22d3ee; --green:#2ee88a; --amber:#fbbf24; --orange:#ff8a1f;
  --display:"Sora",system-ui,sans-serif; --sans:"Manrope",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{color:var(--fg);font:16px/1.45 var(--sans);min-height:100vh;
  background:radial-gradient(90% 40% at 0% 0%,rgba(147,51,234,.38),transparent 70%),radial-gradient(70% 35% at 100% 45%,rgba(232,121,249,.16),transparent 70%),radial-gradient(90% 35% at 0% 100%,rgba(34,211,238,.1),transparent 70%),var(--bg);background-attachment:fixed}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:680px;margin:0 auto;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(130px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font:700 28px/1.1 var(--display);letter-spacing:-.03em;margin:0;overflow-wrap:anywhere}
h2{font:600 16px var(--display);letter-spacing:-.01em;margin:0}
h3{font:600 14px var(--display);margin:0}
a{color:var(--fuchsia)}
button{font:inherit;cursor:pointer;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:44px;-webkit-tap-highlight-color:transparent;transition:transform .1s,box-shadow .15s,background .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--fuchsia);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13px;font-weight:600}
.muted{color:var(--muted);font-size:14px}
.sec{background:var(--card);border:1px solid rgba(168,85,247,.25);border-radius:20px;padding:16px;display:grid;gap:12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);min-width:0}
.sec-h{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.step{font:700 12px var(--mono);color:var(--fuchsia);background:rgba(232,121,249,.12);border:1px solid rgba(232,121,249,.4);border-radius:99px;padding:2px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full,.full{grid-column:1/-1}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f input,textarea,select,input.in{font:16px var(--sans);color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0;min-height:44px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
select option{background:#160d28;color:#fff}
input::placeholder,textarea::placeholder{color:#7d73a0}
input:disabled{opacity:.5}
.mono{font-family:var(--mono)!important;font-size:15px!important}
textarea{resize:vertical;min-height:96px;line-height:1.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;background:rgba(255,255,255,.04);border:1.5px solid rgba(168,85,247,.35);color:#e9e2fb;min-height:40px}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,rgba(168,85,247,.55),rgba(147,51,234,.35));border-color:#c084fc;color:#fff;box-shadow:0 0 12px rgba(168,85,247,.55),inset 0 1px 0 rgba(255,255,255,.2)}
.chip.red[aria-pressed="true"]{background:rgba(255,46,122,.22);border-color:var(--pink);box-shadow:0 0 12px rgba(255,46,122,.5)}
.chip.ok[aria-pressed="true"]{background:rgba(46,232,138,.2);border-color:var(--green);color:#dcfff0;box-shadow:0 0 12px rgba(46,232,138,.45)}
.chip.amber[aria-pressed="true"]{background:rgba(251,191,36,.18);border-color:var(--amber);color:#fde68a;box-shadow:0 0 12px rgba(251,191,36,.4)}
.chip small{font-weight:600;opacity:.8;margin-left:6px;font-size:11px}
.grp{font:700 11.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{--c:var(--purple);border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center;text-align:left;font-weight:700;font-size:14px;line-height:1.15;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,transparent),rgba(20,12,36,.6));border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent)}
.tile[aria-pressed="true"]{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 32%,transparent),rgba(20,12,36,.6));border-color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 55%,transparent)}
.tile i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.c-foco_rojo{--c:var(--pink)}.c-instalacion{--c:var(--purple)}.c-tv{--c:var(--cyan)}.c-potencia{--c:var(--orange)}
.c-tv i,.c-potencia i{color:#120a00}
.primary{display:flex;gap:8px;justify-content:center;align-items:center;border-radius:18px;padding:14px;font:700 15px var(--display);color:#fff;border:0;text-decoration:none;
  background:linear-gradient(135deg,var(--purple-d),var(--fuchsia));box-shadow:0 0 18px rgba(232,121,249,.5),inset 0 1px 0 rgba(255,255,255,.35)}
.ghost{display:inline-flex;gap:6px;align-items:center;justify-content:center;border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;color:#f0e9ff;text-decoration:none;background:rgba(255,255,255,.04);border:1.5px solid rgba(168,85,247,.45);min-height:44px}
.ghost svg{width:17px;height:17px}
.danger{color:#ff8fb5;border:1.5px solid var(--pink);background:rgba(255,46,122,.1)}
.back{display:inline-flex;align-items:center;gap:4px;padding:8px 12px 8px 8px;border-radius:99px;font-weight:700;font-size:14px;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);min-height:40px}
.box{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px;background:rgba(0,0,0,.22);min-width:0}
.note{border-radius:14px;padding:12px;font-size:14px;line-height:1.45}
.note.r{background:rgba(255,46,122,.12);border:1px solid rgba(255,46,122,.55);color:#ffd3e2}
.note.a{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.55);color:#fde9b0}
.note.g{background:rgba(46,232,138,.1);border:1px solid rgba(46,232,138,.5);color:#d3ffe9}
.note.n{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.note b{color:#fff}
.pv{font:700 12.5px var(--mono);padding:2px 8px;border-radius:99px;white-space:nowrap;display:inline-block}
.pv.r{color:#ffc2d6;background:rgba(255,46,122,.18);border:1px solid var(--pink)}
.pv.a{color:#fde68a;background:rgba(251,191,36,.16);border:1px solid var(--amber)}
.pv.g{color:#bff7d8;background:rgba(46,232,138,.16);border:1px solid var(--green)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.07);color:#e9e2fb;white-space:nowrap}
.tag.Cliente{background:rgba(251,191,36,.16);color:#fde68a}.tag.Técnico{background:rgba(34,211,238,.16);color:#bdf4ff}
.tag[class*="Red"]{background:rgba(168,85,247,.2);color:#e5ccff}.tag.Externo{background:rgba(255,255,255,.1);color:#ddd}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.g{background:var(--green);box-shadow:0 0 8px var(--green)}.dot.a{background:var(--amber);box-shadow:0 0 8px var(--amber)}.dot.r{background:var(--pink);box-shadow:0 0 8px var(--pink)}
.item{--c:var(--purple);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:12px;border-radius:18px;text-decoration:none;color:var(--fg);
  background:var(--card);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);min-width:0}
.item .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.item b{display:block;font-weight:700;font-size:15px;overflow-wrap:anywhere}
.item small{display:block;color:#d6cdee;font-size:12.5px;overflow-wrap:anywhere}
.list{display:grid;gap:8px}
.empty{background:var(--card);border:1px dashed rgba(168,85,247,.45);border-radius:18px;padding:22px 16px;color:var(--muted);text-align:center}
.searchbox{display:flex;align-items:center;gap:10px;border-radius:14px;padding:0 14px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.searchbox input{flex:1;min-width:0;font:inherit;padding:12px 0;border:0;background:transparent;color:var(--fg);outline:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border-radius:16px;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid var(--line);text-align:left;display:grid;gap:2px;min-width:0}
.stat b{font:700 24px var(--display);letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);font-weight:600;line-height:1.25}
.stat.r b{color:var(--pink)}.stat.a b{color:var(--amber)}.stat.g b{color:var(--green)}
.bars{display:grid;gap:10px}
.barrow{display:grid;gap:5px;text-align:left;background:none;border:0;padding:4px 0;border-radius:10px;width:100%}
.barrow .lab{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.barrow .lab b{font-weight:600}.barrow .lab span{font:600 13px var(--mono)}
.track{height:10px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--c,var(--purple));box-shadow:0 0 10px var(--c,var(--purple))}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--fg)}
.rank:first-child{border-top:0}
.rank .n{font:700 14px var(--mono);color:var(--muted)}
.rank b{font-weight:700;font-size:15px;display:block;overflow-wrap:anywhere}.rank small{color:var(--muted);font-size:12.5px}
.rank .v{font:600 13px var(--mono);text-align:right;white-space:nowrap}
.gtab{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px 10px;align-items:center;font-size:13px}
.gtab>b{color:var(--muted);font-weight:600}
.gtab input{text-align:center}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ph{position:relative;border-radius:14px;border:1.5px dashed rgba(168,85,247,.5);background:rgba(0,0,0,.25);min-height:110px;display:grid;place-items:center;text-align:center;padding:8px;color:var(--fuchsia);font-weight:700;font-size:14px;overflow:hidden}
.ph small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .x{position:absolute;top:6px;right:6px;width:34px;height:34px;min-height:34px;padding:0;border-radius:50%;background:rgba(12,7,22,.8);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center}
.ph .lbl{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;background:rgba(12,7,22,.8);padding:2px 8px;border-radius:99px;color:#fff}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.thumbs a{display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.06);position:relative}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs span{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:700;background:rgba(12,7,22,.8);padding:1px 6px;border-radius:99px}
details.vis{border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
details.vis[open]{border-color:rgba(232,121,249,.45)}
details.vis>summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px}
details.vis>summary::-webkit-details-marker{display:none}
details.vis .body{padding:0 12px 12px;display:grid;gap:10px}
.kv{display:grid;gap:2px;font-size:14px;line-height:1.4}
.kv>span:first-child{font:700 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;padding:0 2px;border-bottom:1px solid var(--line)}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%;min-width:0}
.chart i{display:block;width:100%;max-width:34px;border-radius:6px 6px 0 0}
.chart span{font:600 10.5px var(--mono)}
.chart-x{display:flex;gap:6px;padding:0 2px}.chart-x span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.sema{display:flex;align-items:center;gap:12px;border-radius:18px;padding:14px}
.sema.r{background:rgba(255,46,122,.16);border:1.5px solid var(--pink)}.sema.a{background:rgba(251,191,36,.12);border:1.5px solid var(--amber)}.sema.g{background:rgba(46,232,138,.1);border:1.5px solid rgba(46,232,138,.6)}
.sema .lights{display:grid;gap:4px}.sema .lights i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.12)}
.sema.r .lights i:nth-child(1){background:var(--pink);box-shadow:0 0 10px var(--pink)}
.sema.a .lights i:nth-child(2){background:var(--amber);box-shadow:0 0 10px var(--amber)}
.sema.g .lights i:nth-child(3){background:var(--green);box-shadow:0 0 10px var(--green)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.acts>*{display:grid;justify-items:center;gap:4px;padding:10px 4px;font-size:13px;font-weight:700;text-align:center}
.map{height:340px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#1a1430}
.map.big{height:calc(100vh - 290px);min-height:360px}
.leaflet-container{font:14px var(--sans)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#160d28;color:#fff}
.leaflet-popup-content b{display:block;font-size:15px}
.leaflet-popup-content a{color:var(--fuchsia);font-weight:700}
.dock{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:1000;
  max-width:656px;margin:0 auto;border-radius:24px;padding:8px;display:flex;gap:6px;align-items:center;
  background:rgba(20,12,36,.78);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:0 10px 30px rgba(0,0,0,.55)}
.dock a{flex:1;display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);padding:7px 0;border-radius:16px;text-decoration:none;min-height:44px}
.dock a[aria-current="page"]{color:#fff;background:rgba(168,85,247,.22);box-shadow:inset 0 0 0 1px rgba(192,132,252,.5),0 0 14px rgba(168,85,247,.35)}
.dock .primary{flex:1.6;padding:12px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.06);border:0;min-height:30px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--d,var(--green));box-shadow:0 0 8px var(--d,var(--green))}
.sync.wait{--d:var(--amber);color:#fde7a8}.sync.err{--d:var(--pink);color:#ffc2d6}.sync.off{--d:#8a80a8;color:var(--muted)}
.banner{border-radius:14px;padding:10px 12px;font-size:13px;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.45);color:#c8f6ff}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2000;background:#2a1a47;border:1px solid rgba(232,121,249,.6);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:99px;box-shadow:0 0 20px rgba(232,121,249,.4);max-width:90vw;text-align:center}
.lugrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lugrow:first-child{border-top:0}
.lugrow b{font-weight:700}.lugrow small{display:block;color:var(--muted);font-size:12px}
.gate{min-height:70vh;display:grid;align-content:center;gap:16px}
.code{font:700 34px var(--mono);letter-spacing:.2em;text-align:center;color:var(--fuchsia);text-shadow:0 0 14px rgba(232,121,249,.6)}
@media (max-width:380px){.tiles{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="wrap" id="app"><p class="muted">Cargando…</p></main>
<nav class="dock" id="dock" hidden></nav>
<div id="toast" hidden role="status"></div>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/leaflet.js"></script>
<script>
"use strict";
/* ============ básicos ============ */
const CFG=window.VISITAS_CONFIG||{};
const DEMO=!(CFG.url&&CFG.anonKey);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
const digits=s=>String(s||"").replace(/\D/g,"");

const uid=()=>crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16)});

const idb=(()=>{let p;const db=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open("visitas",1);r.onupgradeneeded=()=>r.result.createObjectStore("blobs");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));

const S={lugares:[],clientes:[],visitas:[],outbox:[],rol:DEMO?"admin":null,disp:null,syncing:false,lastSync:0,err:"",hayAdmin:true,started:false};

function loadCache(){const c=LS.get("vz-cache")||{};S.lugares=c.lugares||[];S.clientes=c.clientes||[];S.visitas=c.visitas||[];S.lastSync=c.lastSync||0;S.outbox=LS.get("vz-outbox")||[]}
function saveCache(){LS.set("vz-cache",{lugares:S.lugares,clientes:S.clientes,visitas:S.visitas,lastSync:S.lastSync})}
function wipeLocal(){S.lugares=[];S.clientes=[];S.visitas=[];LS.del("vz-cache")}
function applyLocal(op){
  if(op.k==="up"){const a=S[op.t];const i=a.findIndex(r=>r.id===op.row.id);if(i>=0)a[i]={...a[i],...op.row};else a.push({...op.row})}
  else if(op.k==="del"){
    if(op.t==="clientes")S.visitas=S.visitas.filter(v=>v.cliente_id!==op.id);
    if(op.t==="lugares"){const gone=new Set([op.id]);let ch=true;while(ch){ch=false;for(const l of S.lugares)if(l.padre&&gone.has(l.padre)&&!gone.has(l.id)){gone.add(l.id);ch=true}}
      S.lugares=S.lugares.filter(l=>!gone.has(l.id));S.clientes.forEach(c=>{if(gone.has(c.lugar_id))c.lugar_id=null});return}
    S[op.t]=S[op.t].filter(r=>r.id!==op.id)}}
function commit(ops){
  ops.forEach(o=>{if(o.k==="up"||o.k==="del")applyLocal(o)});
  if(DEMO){ops.forEach(o=>{if(o.k==="fotodel")idb.del(o.path)})}
  else{S.outbox.push(...ops);LS.set("vz-outbox",S.outbox)}
  saveCache();flush();renderSync()}
async function runOp(op){
  if(op.k==="up"){const {error}=await sb.from(op.t).upsert(pick(op.t,op.row));if(error)throw error}
  else if(op.k==="del"){const {error}=await sb.from(op.t).delete().eq("id",op.id);if(error)throw error}
  else if(op.k==="foto"){const b=await idb.get(op.path);if(!b)return;const {error}=await sb.storage.from("fotos").upload(op.path,b,{contentType:"image/jpeg",upsert:true});if(error)throw error;await idb.del(op.path)}
  else if(op.k==="fotodel"){await idb.del(op.path);await sb.storage.from("fotos").remove([op.path])}}
async function flush(){
  if(DEMO||!sb||S.syncing||!navigator.onLine||!ADM()||!S.outbox.length)return;
  S.syncing=true;renderSync();
  try{while(S.outbox.length){await runOp(S.outbox[0]);S.outbox.shift();LS.set("vz-outbox",S.outbox)}S.err=""}
  catch(e){S.err=msg(e)}
  finally{S.syncing=false;renderSync()}}
async function fetchAll(t){let all=[];for(let from=0;;from+=1000){const {data,error}=await sb.from(t).select("*").range(from,from+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break}return all}
async function refresh(){
  if(DEMO||!sb||!navigator.onLine||!(S.rol==="admin"||S.rol==="lector"))return;
  try{const [l,c,v]=await Promise.all(["lugares","clientes","visitas"].map(fetchAll));
    S.lugares=l;S.clientes=c;S.visitas=v;S.outbox.forEach(o=>{if(o.k==="up"||o.k==="del")applyLocal(o)});
    S.lastSync=Date.now();saveCache();if(!S.err)S.err="";softRender()}
  catch(e){S.err=msg(e);renderSync()}}
function syncHTML(){
  if(DEMO)return `<span class="sync off">Modo demostración</span>`;
  if(!navigator.onLine)return `<button class="sync off" data-act="sync">Sin internet${S.outbox.length?" · "+S.outbox.length+" por subir":""}</button>`;
  if(S.syncing)return `<span class="sync wait">Subiendo…</span>`;
  if(S.err)return `<button class="sync err" data-act="sync">Error al sincronizar · reintentar</button>`;
  if(S.outbox.length)return `<button class="sync wait" data-act="sync">${S.outbox.length} por subir</button>`;
  return `<button class="sync" data-act="sync">Sincronizado</button>`}

function dist(a1,o1,a2,o2){const R=6371e3,r=Math.PI/180;const dA=(a2-a1)*r,dO=(o2-o1)*r;const x=Math.sin(dA/2)**2+Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dO/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

function detectarLugar(txt){
  const clean=s=>norm(s).replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
  const t=" "+clean(txt)+" ";let best=null;
  for(const l of S.lugares)for(const w of [l.nombre,...(l.palabras||[])]){const n=clean(w);if(n.length<3)continue;
    if(t.includes(" "+n+" ")){const sc=lugarDepth(l.id)*1000+n.length;if(!best||sc>best.sc)best={id:l.id,sc,w}}}
  return best}

function parse(txt){
  const out={tecnico:"",soporte:"",cliente:"",direccion:"",tel:"",ip:"",cedula:"",correo:"",plan:"",nap:"",hilo:"",potAntes:"",coords:"",mapa:"",extra:[]};
  const MAPRE=/(https?:\/\/)?(maps\.app\.goo\.gl|goo\.gl\/maps|(www\.)?google\.[a-z.]+\/maps|maps\.google\.[a-z.]+|g\.co\/kgs)\S*/gi;
  for(const raw of String(txt||"").split(/\r?\n/)){let l=raw.trim();if(!l)continue;
    const mm=l.match(MAPRE);if(mm){if(!out.mapa)out.mapa=mm[0].startsWith("http")?mm[0]:"https://"+mm[0];l=l.replace(MAPRE,"").trim();
      if(!l||/^(ubicaci[oó]n|ubicaci[oó]n del cliente|maps?|google maps|link|enlace|direcci[oó]n en maps)\s*[,.:]*$/i.test(l))continue;l=l.replace(/[\s,.:\-]+$/,"");if(!l)continue}
    {const nm=l.match(/^nap\s*[,.:]?\s*([A-Za-z0-9]+(?:-[A-Za-z0-9]+)*)\s*(?:[,;/]?\s*(?:h(?:ilo)?)\s*[:.#]?\s*(\d+))?\s*$/i);
      if(nm){out.nap=nm[1].toUpperCase();if(nm[2])out.hilo=nm[2];continue}
      const cm=l.match(/^coordenadas?\s*[,.:]?\s*(.+)$/i);if(cm){out.coords=cm[1].trim();continue}
      const im=l.match(/^ip\s*[,.:]?\s*(\d{1,3}(?:\.\d{1,3}){3})\s*$/i);if(im){out.ip=im[1];continue}
      const tm=l.match(/^(?:tel[eé]fonos?|telf?|cel(?:ular)?)\.?\s*[,.:]?\s*(\+?\d[\d\s\/,y-]{5,})$/i);if(tm){out.tel=tm[1].trim();continue}
      const hm=l.match(/^hilo\s*[,.:#]?\s*(\d+)\s*$/i);if(hm){out.hilo=hm[1];continue}
      const pm=l.match(/^potencia(?:\s+actual)?\s*[,.:]?\s*(-?\s*\d+(?:[.,]\d+)?)\s*(?:dbm)?\s*$/i);
      if(pm){out.potAntes=pm[1].replace(/\s/g,"").replace(",",".");continue}}
    const m=l.match(/^(t[eé]cnicos?|soporte|cliente|direcci[oó]n|tel[eé]fono|tel[eé]f|tel|celular|cel|ip|c[eé]dula|correo(?: electr[oó]nico)?|plan|nap)\s*[,.:]+\s*(.*)$/i);
    if(!m){if(!/^instalaci[oó]n\.?$/i.test(l))out.extra.push(l);continue}
    const k=m[1].toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    const key=k.startsWith("tecnico")?"tecnico":k.startsWith("direc")?"direccion":/^(tel|cel)/.test(k)?"tel":k.startsWith("correo")?"correo":k;
    out[key]=m[2].trim()}
  out.extra=out.extra.join("\n");return out}
const DMS=/(\d{1,3})\s*°\s*(\d{1,2})\s*['’′]\s*(\d{1,2}(?:[.,]\d+)?)\s*(?:"|”|″|'')?\s*([NS])[\s,;]+(\d{1,3})\s*°\s*(\d{1,2})\s*['’′]\s*(\d{1,2}(?:[.,]\d+)?)\s*(?:"|”|″|'')?\s*([EWO])/i;
function coordsDec(t){t=String(t||"");const m=t.match(DMS);
  if(m){const f=(d,mi,se)=>+d+ +mi/60+ +String(se).replace(",",".")/3600;let la=f(m[1],m[2],m[3]),lo=f(m[5],m[6],m[7]);if(/s/i.test(m[4]))la=-la;if(/[wo]/i.test(m[8]))lo=-lo;return [la,lo]}
  const at=t.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/);if(at)return [+at[1],+at[2]];
  const q=t.match(/[?&](?:q|query|destination|ll)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i);if(q)return [+q[1],+q[2]];
  const d=t.match(/(-?\d{1,2}\.\d{3,})\s*[,;\s]\s*(-?\d{1,3}\.\d{3,})/);return d?[+d[1],+d[2]]:null}
const telsFrom=s=>(String(s||"").match(/\+?\d[\d\s-]{5,13}\d/g)||[]).map(x=>x.replace(/[\s-]/g,"")).filter((x,i,a)=>a.indexOf(x)===i);

async function comprimir(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const M=1600,s=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",.72))}
  finally{URL.revokeObjectURL(url)}}
const fotoURL=new Map();
async function hydratePhotos(root=document){
  const els=[...root.querySelectorAll("[data-foto]")];if(!els.length)return;
  const need=[];
  for(const el of els){const p=el.dataset.foto;if(fotoURL.has(p)){setFoto(el,fotoURL.get(p));continue}
    const b=await idb.get(p);if(b){const u=URL.createObjectURL(b);fotoURL.set(p,u);setFoto(el,u)}else need.push(p)}
  if(need.length&&sb&&navigator.onLine){const uniq=[...new Set(need)];
    const {data}=await sb.storage.from("fotos").createSignedUrls(uniq,3600).catch(()=>({data:null}))||{};
    (data||[]).forEach(d=>{if(d.signedUrl){fotoURL.set(d.path,d.signedUrl)}});
    els.forEach(el=>{const u=fotoURL.get(el.dataset.foto);if(u)setFoto(el,u)})}}
function setFoto(el,u){if(el.tagName==="IMG")el.src=u;else if(el.tagName==="A")el.href=u}

function buscar(t){const n=norm(t),d=digits(t);return S.clientes.filter(c=>{const h=norm([c.nombre,c.direccion,c.ip,c.nap,lugarTxt(c.lugar_id)].join(" "));return h.includes(n)||(d.length>=4&&digits((c.telefono||"")+" "+(c.telefono2||"")).includes(d))||(c.ip&&c.ip.includes(t.trim()))}).slice(0,15)}

  </section>

function visDetalle(v,open){const t=TIPOS[v.tipo]?v.tipo:"foco_rojo";const cmp=comparativa(v);

  return {...n,visitaId:v.id,tipo:v.tipo,fecha:ts(v.fecha),companero:v.companero||"",previa_otra:!!v.previa_otra,sintomas:[...(v.sintomas||[])],hallazgos:[...(v.hallazgos||[])],soluciones:[...(v.soluciones||[])],

function secPegar(){return `<section class="sec"><div class="sec-h"><h2>Pega la planificación</h2><span class="step">02</span></div>

  <div class="searchbox">${ICON.search}<input id="cq" type="search" placeholder="Nombre, teléfono, IP…" aria-label="Buscar cliente existente"></div><div id="cqres"></div></section>`}
function candidatos(){
  const tels=cur.tels.map(t=>digits(t.n)).filter(x=>x.length>=7);const nm=norm(cur.nombre);
  return S.clientes.filter(c=>c.id!==cur.clienteId).map(c=>{const why=[];

  return `<section class="sec"><div class="sec-h"><h2>Datos del cliente</h2><span class="step">03</span></div>

function retornos(V){const list=[];V.forEach(v=>{const t=ts(v.fecha);const sig=S.visitas.find(w=>w.cliente_id===v.cliente_id&&w.id!==v.id&&w.tipo!=="instalacion"&&ts(w.fecha)>t&&ts(w.fecha)-t<=30*DAY);if(sig)list.push(v)});return{n:list.length,total:V.length,pct:pct(list.length,V.length),list}}
function drillList(V,sop,ret){const {kind,key}=P.drill;let t="",L=[];
  if(kind==="todas"){t="Todas las visitas";L=V}
  else if(kind==="causa"){t="Causa: "+key;L=sop.filter(v=>(v.causa||"Sin causa")===key)}
  else if(kind==="hallazgo"){t="Hallazgo: "+key;L=sop.filter(v=>(v.hallazgos||[]).includes(key))}
  else if(kind==="tipo"){t=TIPOS[key]||key;L=V.filter(v=>v.tipo===key)}
  else if(kind==="lugar"){t="Lugar: "+(key==="_"?"Sin lugar":(Lg(key)||{}).nombre);L=V.filter(v=>{const c=Cl(v.cliente_id);const r=c&&lugarRaiz(c.lugar_id);return key==="_"?!r:r&&r.id===key})}
  else if(kind==="retorno"){t="Visitas que tuvieron retorno en 30 días";L=ret.list}
  else if(kind==="noco"){t="La versión del cliente no coincide";L=sop.filter(v=>{const c=comparativa(v);return c&&!c.ok})}
  else if(kind==="rojos"){const cs=S.clientes.filter(c=>semaforo(c.id).c==="r"&&(!P.raiz||lugarRaiz(c.lugar_id)?.id===P.raiz));
    return `<section class="sec" style="border-color:var(--fuchsia)"><div class="sec-h"><h2>Clientes en rojo</h2><button class="ghost" data-act="drillX" aria-label="Cerrar detalle">${ICON.x}</button></div>${cs.length?`<div class="list">${cs.map(clienteItem).join("")}</div>`:`<p class="muted" style="margin:0">Ninguno.</p>`}</section>`}
  L=[...L].sort((a,b)=>ts(b.fecha)-ts(a.fecha));
  return `<section class="sec" style="border-color:var(--fuchsia)"><div class="sec-h"><h2>${esc(t)} · ${L.length}</h2><button class="ghost" data-act="drillX" aria-label="Cerrar detalle">${ICON.x}</button></div>${L.length?`<div class="list">${L.slice(0,60).map(v=>visitaItem(v)).join("")}</div>`:`<p class="muted" style="margin:0">Sin visitas.</p>`}</section>`}
function csv(){

async function loadDevs(){if(devLoading)return;devLoading=true;devErr="";try{const {data,error}=await sb.from("dispositivos").select("*").order("creado");if(error)throw error;devs=data;
  const a=await sb.from("ajustes").select("*").eq("id",1).maybeSingle();abiertas=a.error?null:(a.data?a.data.solicitudes_abiertas!==false:true)}catch(e){devErr=msg(e);devs=devs||[]}devLoading=false;if(route().name==="ajustes"){render.keepScroll=true;render()}}

/* ============ eventos ============ */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act],[data-chip]");if(!b)return;
  if(b.dataset.chip){const g=b.dataset.chip,v=b.dataset.val;
    if(Array.isArray(cur[g])){cur[g]=cur[g].includes(v)?cur[g].filter(x=>x!==v):[...cur[g],v]}else cur[g]=cur[g]===v?(g==="estado"?v:""):v;
    if(g==="sintomas"||g==="hallazgos")re("s-diag",secDiag());else if(g==="etiqueta_estado")re("s-etq",secEtiqueta());else if(g==="soluciones")re("s-sol",secSol());else if(g==="estado")re("s-estado",secEstado());return}
  const a=b.dataset.act;
  switch(a){
   case "tipo":cur.tipo=b.dataset.val;render.keepScroll=true;render();break;
   case "pegar":try{const t=await navigator.clipboard.readText();if(t){cur.pegado=t;leerPlan()}else toast("El portapapeles está vacío")}catch(err){toast("Pega el texto con mantener presionado › Pegar")}break;
   case "leer":cur.pegado=$("pegado").value;leerPlan();break;
   case "mismo":usarCliente(b.dataset.id);break;
   case "nuevoCli":cur.decidido=true;cur.clienteId=null;re("s-match","");break;
   case "telOk":cur.tels.forEach((t,i)=>t.ok=i===+b.dataset.i);re("s-match",secMatch());b.closest("section").outerHTML=secCliente();break;
   case "telDel":cur.tels.splice(+b.dataset.i,1);if(cur.tels.length&&!cur.tels.some(t=>t.ok))cur.tels[0].ok=true;b.closest("section").outerHTML=secCliente();break;
   case "telAdd":{const n=$("telNuevo").value.trim();if(!n)break;cur.tels.push({n,ok:!cur.tels.length});b.closest("section").outerHTML=secCliente();re("s-match",secMatch());break}
   case "lugAdd":{const n=$("lugNuevo").value.trim();if(!n)break;const ch=lugarChain(cur.lugar_id);const parent=!ch.length?null:ch.length<3?ch[ch.length-1]:ch[ch.length-2];
     const l={id:uid(),nombre:n,padre:parent?parent.id:null,palabras:[],creado:new Date().toISOString()};commit([{k:"up",t:"lugares",row:l}]);cur.lugar_id=l.id;re("s-lugar",secLugar());toast("Lugar agregado");break}
   case "lugPalabra":{const w=$("lugPalabra").value.trim();const l=Lg(cur.lugar_id);if(!w||!l)break;commit([{k:"up",t:"lugares",row:{...l,palabras:[...new Set([...(l.palabras||[]),w])]}}]);cur.lugarAuto={id:l.id,w};re("s-lugar",secLugar());toast("La próxima vez reconoceré «"+w+"»");break}
   case "gps":tomarGPS();break;
   case "ubicBorrar":cur.lat=cur.lng=cur.precision_m=null;cur.coordsTxt="";re("s-ubic",secUbic());break;
   case "previa":cur.previa_otra=!cur.previa_otra;b.setAttribute("aria-pressed",cur.previa_otra);break;
   case "otro":{const inp=$(b.dataset.src);const v=inp.value.trim();if(!v)break;const g=b.dataset.grp;if(!cur[g].includes(v))cur[g].push(v);g==="hallazgos"?re("s-diag",secDiag()):re("s-sol",secSol());break}
   case "causa":cur.causa=b.dataset.val;cur.causaManual=true;re("s-diag",secDiag());break;
   case "sinsenal":cur.sin_senal=!cur.sin_senal;re("s-pot",secPot());break;
   case "etqCopiar":{const t=etiquetaTxt();if(!t){toast("Escribe nombre, NAP e hilo");break}try{await navigator.clipboard.writeText(t);toast("Texto copiado")}catch(err){toast("No se pudo copiar")}break}
   case "fotoDel":quitarFoto(b.dataset.path);break;
   case "guardar":guardar();break;
   case "visBorrar":if(confirm("¿Eliminar esta visita? No se puede deshacer.")){const v=S.visitas.find(x=>x.id===cur.visitaId);const cid=v.cliente_id;commit([{k:"del",t:"visitas",id:v.id},...(v.fotos||[]).map(f=>({k:"fotodel",path:f.path}))]);cur=null;location.hash="#/cliente/"+cid;toast("Visita eliminada")}break;
   case "cliGuardar":{const c=Cl(b.dataset.id);const g=id=>$(id).value.trim();const nh=g("ce-naphilo").match(/^([^\s]+?)(?:\s*h-?\s*(\d+))?$/i);const co=coordsDec(g("ce-coords"));
     if(!g("ce-nombre")){toast("Falta el nombre");break}
     commit([{k:"up",t:"clientes",row:{...pick("clientes",c),nombre:g("ce-nombre"),telefono:g("ce-telefono")||null,telefono2:g("ce-telefono2")||null,ip:g("ce-ip")||null,direccion:g("ce-direccion")||null,lugar_id:g("ce-lugar")||null,
       nap:nh?nh[1].toUpperCase():null,hilo:nh&&nh[2]?nh[2]:null,lat:co?co[0]:g("ce-coords")?c.lat:null,lng:co?co[1]:g("ce-coords")?c.lng:null,precision_m:co&&co[0]!==c.lat?null:c.precision_m,notas:g("ce-notas")||null,editado:new Date().toISOString()}}]);
     editCli=false;render.keepScroll=true;render();toast("Cliente actualizado");break}
   case "cliBorrar":{const c=Cl(b.dataset.id);if(!confirm("¿Eliminar a "+c.nombre+" y todas sus visitas? No se puede deshacer."))break;
     const fotos=visCli(c.id).flatMap(v=>(v.fotos||[]).map(f=>({k:"fotodel",path:f.path})));commit([{k:"del",t:"clientes",id:c.id},...fotos]);location.hash="#/";toast("Cliente eliminado");break}
   case "drill":P.drill={kind:b.dataset.kind,key:b.dataset.key};render.keepScroll=true;render();$("drill")?.scrollIntoView({behavior:"smooth",block:"start"});break;
   case "drillX":P.drill=null;render.keepScroll=true;render();break;
   case "csv":csv();break;
   case "mraiz":M.raiz=b.dataset.val;render.keepScroll=true;render();break;
   case "sync":S.err="";renderSync();await flush();await refresh();break;
   case "descartar":if(confirm("¿Descartar este cambio? No se subirá a la nube.")){S.outbox.shift();LS.set("vz-outbox",S.outbox);S.err="";flush();render.keepScroll=true;render()}break;
   case "devsReload":devs=null;render.keepScroll=true;render();break;
   case "devRol":{const {error}=await sb.from("dispositivos").update({rol:b.dataset.val}).eq("user_id",b.dataset.id);if(error){toast("Error: "+msg(error));break}toast("Acceso actualizado");loadDevs();break}
   case "solicitudes":{const v=b.dataset.val==="1";const {error}=await sb.from("ajustes").update({solicitudes_abiertas:v}).eq("id",1);if(error){toast("Error: "+msg(error));break}abiertas=v;toast(v?"Solicitudes abiertas":"Solicitudes cerradas");render.keepScroll=true;render();break}
   case "devDel":if(confirm("¿Quitar este dispositivo? Tendrá que pedir acceso de nuevo.")){const {error}=await sb.from("dispositivos").delete().eq("user_id",b.dataset.id);if(error)toast("Error: "+msg(error));loadDevs()}break;
   case "lugEdit":lugEditId=lugEditId===b.dataset.id?null:b.dataset.id;render.keepScroll=true;render();break;
   case "lugSave":{const l=Lg(b.dataset.id);const n=$("le-nombre").value.trim();if(!n)break;const pal=$("le-pal").value.split(",").map(s=>s.trim()).filter(Boolean);const ops=[{k:"up",t:"lugares",row:{...l,nombre:n,palabras:pal}}];
     const h=$("le-hijo")?.value.trim();if(h)ops.push({k:"up",t:"lugares",row:{id:uid(),nombre:h,padre:l.id,palabras:[],creado:new Date().toISOString()}});commit(ops);if(!h)lugEditId=null;render.keepScroll=true;render();toast("Guardado");break}
   case "lugDel":{const l=Lg(b.dataset.id);if(confirm("¿Eliminar «"+l.nombre+"» y sus sectores/barrios? Los clientes quedan sin lugar.")){commit([{k:"del",t:"lugares",id:l.id}]);lugEditId=null;render.keepScroll=true;render()}break}
   case "lugRaizAdd":{const n=$("lugRaizNueva").value.trim();if(!n)break;commit([{k:"up",t:"lugares",row:{id:uid(),nombre:n,padre:null,palabras:[],creado:new Date().toISOString()}}]);render.keepScroll=true;render();break}
   case "update":if(navigator.serviceWorker){const r=await navigator.serviceWorker.getRegistration();if(r){await r.update();if(r.waiting){r.waiting.postMessage("skip");toast("Actualizando…")}else toast("Ya tienes la última versión")}}break;
   case "pedir":pedirAcceso();break;
   case "check":checkDevice();break;
   case "reclamar":{const {data,error}=await sb.rpc("reclamar_admin");if(error||!data)toast(error?msg(error):"Ya existe un administrador");checkDevice();break}
  }});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){q=t.value;$("qres").innerHTML=q.trim()?resHTML(buscar(q)):"";return}
  if(t.id==="cq"){const v=t.value.trim();$("cqres").innerHTML=v?`<div class="list" style="margin-top:8px">${buscar(v).slice(0,6).map(c=>`<button type="button" class="item" data-act="mismo" data-id="${c.id}"><span class="dot ${semaforo(c.id).c}" aria-hidden="true"></span><span style="min-width:0"><b>${esc(c.nombre)}</b><small>${esc(lugarTxt(c.lugar_id)||c.direccion||"")}</small></span><span class="tag">Usar</span></button>`).join("")||'<p class="muted">Sin resultados.</p>'}</div>`:"";return}
  if(t.id==="pegado"){cur.pegado=t.value;return}
  if(t.id==="coordsTxt"){cur.coordsTxt=t.value;const co=coordsDec(t.value);if(co){cur.lat=co[0];cur.lng=co[1];cur.precision_m=null;cur.mapaLink="";const keep=t.value;re("s-ubic",secUbic());const n=$("coordsTxt");if(n){n.value=keep}toast("Coordenadas reconocidas")}return}
  const k=t.dataset.k;if(!k||!cur)return;
  if(k==="fechaTxt"){const d=new Date(t.value);if(!isNaN(d))cur.fecha=d.getTime();return}
  if(k==="onu_despues"||k==="onu_antes"){const m=t.value.match(/(-?\d+(?:[.,]\d+)?)\s*(?:dbm)?\s*\/\s*(-?\d+(?:[.,]\d+)?)/i);
    if(m){cur[k]=m[1].replace(",",".");cur[k.replace("onu","olt")]=m[2].replace(",",".");re("s-pot",secPot());return}}
  cur[k]=t.value;
  if(k.startsWith("onu")||k.startsWith("olt")){$("potRes").innerHTML=potRes();return}
  if(k==="nombre"||k==="nap"||k==="hilo"){const el=$("etqTxt");if(el)el.innerHTML=esc(etiquetaTxt())||'<span class="muted">Escribe nombre, NAP e hilo</span>'}
  if(k==="nombre"||k==="ip"){clearTimeout(re.mt);re.mt=setTimeout(()=>re("s-match",secMatch()),400)}
  if(k==="direccion"&&!cur.lugar_id){clearTimeout(re.lt);re.lt=setTimeout(()=>{const d=detectarLugar(cur.direccion);if(d){cur.lugar_id=d.id;cur.lugarAuto=d;re("s-lugar",secLugar())}},500)}});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.fotoTipo){agregarFoto(t);return}
  if(t.dataset.lvl!=null){const i=+t.dataset.lvl;const ch=lugarChain(cur.lugar_id);cur.lugar_id=t.value||(i>0?ch[i-1].id:null);cur.lugarAuto=null;re("s-lugar",secLugar());return}
  if(t.id==="pPer"){P.per=t.value;render.keepScroll=true;render();return}
  if(t.id==="pRaiz"){P.raiz=t.value;render.keepScroll=true;render();return}});
document.addEventListener("toggle",e=>{if(e.target.id==="cliEdit")editCli=e.target.open},true);
window.addEventListener("online",()=>{renderSync();flush().then(refresh);if(!S.started)checkDevice()});
window.addEventListener("offline",renderSync);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!DEMO&&Date.now()-(checkDevice.last||0)>15000)checkDevice()});
setInterval(()=>{if(!DEMO&&sb&&S.started&&document.visibilityState==="visible")checkDevice()},60000);

/* ============ acceso por dispositivo ============ */
function gate(html){S.started=false;$("dock").hidden=true;$("app").innerHTML=`<div class="gate"><div><span class="sub">Meganet</span><h1>Registro de visitas</h1></div>${html}</div>`}
const codigo=()=>Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
async function pedirAcceso(){
  const nombre=($("devNombre")?.value||"").trim();if(!nombre){toast("Escribe un nombre para este dispositivo");return}
  const {data:{session}}=await sb.auth.getSession();
  const {error}=await sb.from("dispositivos").insert({user_id:session.user.id,nombre,codigo:codigo(),rol:"pendiente"});
  if(error){toast(/row-level|policy/i.test(msg(error))?"Las solicitudes de acceso están cerradas":"Error: "+msg(error));checkDevice();return}checkDevice()}
function renderGate(kind,err){
  if(kind==="nuevo"&&S.abiertas===false)gate(`<section class="sec"><h2>Acceso cerrado</h2><p class="muted" style="margin:0">Este registro no acepta nuevos dispositivos.</p></section>`);
  else if(kind==="nuevo")gate(`<section class="sec"><h2>Este dispositivo no tiene acceso</h2><p class="muted" style="margin:0">No se usan usuarios ni claves: cada celular se autoriza una sola vez. Ponle un nombre y pide acceso.</p>
    <label class="f">Nombre del dispositivo<input id="devNombre" placeholder="Ej. iPhone de Kirito / Celular del jefe" autocomplete="off"></label><button class="primary" data-act="pedir">Pedir acceso</button></section>`);
  else if(kind==="pendiente")gate(`<section class="sec"><h2>Esperando aprobación</h2><p class="muted" style="margin:0">Dale este código al administrador para que apruebe <b>${esc(S.disp?.nombre||"este dispositivo")}</b>:</p><div class="code">${esc(S.disp?.codigo||"")}</div><button class="ghost" data-act="check">Ya me aprobaron, comprobar</button></section>
    ${S.hayAdmin?"":`<section class="sec" style="border-color:var(--fuchsia)"><h2>¿Primer uso?</h2><p class="muted" style="margin:0">Aún no hay administrador. Si este es <b>tu</b> celular, conviértelo en el administrador con control total.</p><button class="primary" data-act="reclamar">Este dispositivo es el administrador</button></section>`}`);
  else if(kind==="bloqueado")gate(`<section class="sec"><h2>Acceso bloqueado</h2><p class="muted" style="margin:0">Este dispositivo no tiene permiso para ver el registro.</p></section>`);
  else if(kind==="offline")gate(`<section class="sec"><h2>Sin internet</h2><p class="muted" style="margin:0">Conéctate a internet la primera vez para autorizar este dispositivo. Después funciona sin señal.</p><button class="ghost" data-act="check">Reintentar</button></section>`);
  else gate(`<section class="sec"><h2>No se pudo conectar</h2><div class="note r">${esc(err)}</div>${/anonymous/i.test(err||"")?`<p class="muted" style="margin:0">Activa <b>Allow anonymous sign-ins</b> en Supabase › Authentication › Sign In / Providers.</p>`:""}<button class="ghost" data-act="check">Reintentar</button></section>`)}
function start(){S.started=true;render();refresh();flush()}
async function checkDevice(){
  checkDevice.last=Date.now();
  if(!navigator.onLine){if(!S.started)renderGate("offline");return}
  try{let {data:{session}}=await sb.auth.getSession();
    if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}
    const {data,error}=await sb.from("dispositivos").select("*").eq("user_id",session.user.id).maybeSingle();if(error)throw error;
    S.disp=data;LS.set("vz-disp",data);const prev=S.rol;S.rol=data?data.rol:null;LS.set("vz-rol",S.rol);
    if(S.rol==="admin"||S.rol==="lector"){if(!S.started||prev!==S.rol)start();else{flush();refresh()}}
    else{wipeLocal();S.hayAdmin=!!(await sb.rpc("hay_admin")).data;S.abiertas=(await sb.rpc("solicitudes_abiertas")).data!==false;renderGate(data?data.rol:"nuevo")}}
  catch(e){if(S.started)return;renderGate("error",msg(e))}}
async function boot(){
  loadCache();
  if(DEMO){if(!S.lugares.length){S.lugares=["Palanda","Valladolid","La Canela","San Francisco","Santa Ana","El Porvenir","Tapala"].map(n=>({id:uid(),nombre:n,padre:null,palabras:[],creado:new Date().toISOString()}));saveCache()}start();return}
  if(!window.supabase){$("app").innerHTML=`<div class="empty">No se pudo cargar la librería de Supabase.</div>`;return}
  sb=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"vz-auth"}});
  S.rol=LS.get("vz-rol");S.disp=LS.get("vz-disp");
  if(S.rol==="admin"||S.rol==="lector"){start();checkDevice()}else checkDevice()}
if("serviceWorker" in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").then(r=>{r.addEventListener("updatefound",()=>{const w=r.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)toast("Nueva versión lista: Ajustes › Buscar actualización")})})}).catch(()=>{});
  const hadCtl=!!navigator.serviceWorker.controller;let reloaded=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadCtl&&!reloaded){reloaded=true;location.reload()}})}
boot();
</script>
